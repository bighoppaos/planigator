  <script>
    (function () {
      var fromHome = window.navigator.standalone === true;
      try {
        if (window.matchMedia("(display-mode: standalone)").matches) fromHome = true;
        if (window.matchMedia("(display-mode: fullscreen)").matches) fromHome = true;
      } catch (e) {}
      if (fromHome) document.documentElement.classList.add("from-home");
      var url = new URL(location.href);
      if (url.searchParams.has("refresh")) {
        url.searchParams.delete("refresh");
        history.replaceState(null, "", url.pathname + url.search + url.hash);
      }
      document.querySelectorAll(".page-refresh").forEach(function (button) {
        button.addEventListener("click", function () {
          var next = new URL(location.href);
          next.searchParams.set("refresh", String(Date.now()));
          location.replace(next.href);
        });
      });
    })();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        return Promise.all(regs.map((reg) => reg.unregister()));
      }).then(() => {
        if (!window.caches) return;
        return caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
      });
    }
  </script>
