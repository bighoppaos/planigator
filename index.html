<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planigator</title>
  <meta name="description" content="Plan a truck trip in the browser. Pickup, drop, HERE truck routes, leave-by, 30s, and 10-hour rests stay on this device.">
  <meta name="theme-color" content="#1f8a62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planigator">
  <meta property="og:title" content="Planigator">
  <meta property="og:description" content="Plan a truck trip in the browser. Share the link with anyone.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/PlanigatorIcon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css?v=15">
</head>
<body class="app planner-only">
  <main id="app"></main>
  <footer>
    <nav>
      <a href="./" aria-current="page">Plan</a>
      <a href="./support.html">Support</a>
      <a href="./privacy.html">Privacy</a>
      <a href="./terms.html">Terms</a>
    </nav>
    <p>Planning aid only. Not legal advice. Not a substitute for your ELD.</p>
  </footer>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        return Promise.all(regs.map((reg) => reg.unregister()));
      }).then(() => {
        if (!window.caches) return;
        return caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
      });
    }
  </script>
  <script>
    (function () {
      var watchId = null;
      var error2Timer = null;

      function clearError2Timer() {
        if (error2Timer == null) return;
        clearTimeout(error2Timer);
        error2Timer = null;
      }

      function clearLocateWatch() {
        if (watchId == null) return;
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      function success(pos) {
        clearError2Timer();
        clearLocateWatch();
        if (typeof window.planigatorLocateSuccess === "function") {
          window.planigatorLocateSuccess(pos);
        }
      }

      function onError(error) {
        var code = error && error.code;
        if (code === 2) {
          if (error2Timer == null) {
            error2Timer = setTimeout(function () {
              error2Timer = null;
              clearLocateWatch();
              if (typeof window.planigatorLocateError === "function") {
                window.planigatorLocateError({ code: 2 });
              }
            }, 20000);
          }
          return;
        }
        clearError2Timer();
        clearLocateWatch();
        if (typeof window.planigatorLocateError === "function") {
          window.planigatorLocateError(error || { code: code || "?" });
        }
      }

      window.planigatorLocate = function () {
        clearError2Timer();
        if (watchId != null) clearLocateWatch();
        watchId = navigator.geolocation.watchPosition(success, onError, {
          enableHighAccuracy: false,
          maximumAge: 0
        });
        if (typeof window.planigatorLocateStarted === "function") {
          window.planigatorLocateStarted();
        }
      };
    })();
  </script>
  <script type="module" src="./js/app.js?v=40"></script>
</body>
</html>
