<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planigator</title>
  <meta name="description" content="Plan a truck trip in the browser. Pickup, drop, HERE truck routes, leave-by, 30s, and 10-hour rests stay on this device.">
  <meta name="theme-color" content="#1f8a62">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planigator">
  <meta property="og:title" content="Planigator">
  <meta property="og:description" content="Plan a truck trip in the browser. Share the link with anyone.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/PlanigatorIcon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css?v=15">
</head>
<body class="app planner-only">
  <main id="app"></main>
  <footer>
    <nav>
      <a href="./" aria-current="page">Plan</a>
      <a href="./support.html">Support</a>
      <a href="./privacy.html">Privacy</a>
      <a href="./terms.html">Terms</a>
    </nav>
    <p>Planning aid only. Not legal advice. Not a substitute for your ELD.</p>
    <p>page 47</p>
  </footer>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        return Promise.all(regs.map((reg) => reg.unregister()));
      }).then(() => {
        if (!window.caches) return;
        return caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
      });
    }
  </script>
  <script>
    (function () {
      var watchId = null;
      var prevWatchId = null;
      var err2Timer = null;
      var settled = false;

      function clearErr2Timer() {
        if (err2Timer == null) return;
        clearTimeout(err2Timer);
        err2Timer = null;
      }

      function stopWatch() {
        if (watchId == null) return;
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      function paintOk(lat, lon) {
        var el = document.getElementById("locate-status");
        if (!el) return;
        el.textContent = "Got your location. " + lat + ", " + lon;
        el.className = "ok";
      }

      function paintErr(error) {
        var el = document.getElementById("locate-status");
        if (!el) return;
        var code = error && error.code != null ? error.code : "?";
        var message = error && error.message ? error.message : "";
        if (!message) {
          if (code === 2) message = "no position";
          else if (code === 3) message = "timed out";
        }
        el.textContent = "Safari error " + code + ": " + message;
        el.className = "error";
      }

      function paintErr2() {
        var el = document.getElementById("locate-status");
        if (!el) return;
        el.textContent = "Safari error 2: no position";
        el.className = "error";
      }

      function onPos(pos) {
        if (settled) return;
        settled = true;
        clearErr2Timer();
        stopWatch();
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        paintOk(lat, lon);
        try {
          if (typeof window.planigatorLocateSuccess === "function") {
            window.planigatorLocateSuccess(pos);
          }
        } catch (e) {}
      }

      function onErr(error) {
        var code = error && error.code;
        if (code === 2) {
          if (settled || err2Timer != null) return;
          var err2At = Date.now();
          err2Timer = setTimeout(function () {
            err2Timer = null;
            if (settled) return;
            settled = true;
            stopWatch();
            paintErr2();
            try {
              if (typeof window.planigatorLocateError === "function") {
                window.planigatorLocateError({ code: 2, message: "no position", at: err2At });
              }
            } catch (e) {}
          }, 25000);
          return;
        }
        if (settled) return;
        settled = true;
        clearErr2Timer();
        stopWatch();
        paintErr(error);
        try {
          if (typeof window.planigatorLocateError === "function") {
            window.planigatorLocateError(error || { code: "?" });
          }
        } catch (e) {}
      }

      window.planigatorLocate = function () {
        watchId = navigator.geolocation.watchPosition(onPos, onErr, {
          enableHighAccuracy: false,
          maximumAge: 0
        });
        if (prevWatchId != null && prevWatchId !== watchId) {
          try { navigator.geolocation.clearWatch(prevWatchId); } catch (e) {}
        }
        prevWatchId = watchId;
        clearErr2Timer();
        settled = false;
        try {
          if (typeof window.planigatorLocateStarted === "function") {
            window.planigatorLocateStarted();
          }
        } catch (e) {}
      };
    })();
  </script>
  <script type="module" src="./js/app.js?v=47"></script>
</body>
</html>
