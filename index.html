  <meta name="description" content="Plan a truck trip in the browser. Pickup, drop, HERE truck routes, leave-by, 30s, and 10-hour rests stay on this device.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planigator">

  <meta property="og:description" content="Plan a truck trip in the browser. Share the link with anyone.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/PlanigatorIcon.png">

<body class="app planner-only">
  <main id="app"></main>
  <footer>
    <nav>
      <a href="./" aria-current="page">Plan</a>
      <a href="./support.html">Support</a>
      <a href="./privacy.html">Privacy</a>
      <a href="./terms.html">Terms</a>
    </nav>
    <p>Planning aid only. Not legal advice. Not a substitute for your ELD.</p>
    <p>page 44</p>
  </footer>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        return Promise.all(regs.map((reg) => reg.unregister()));
      }).then(() => {
        if (!window.caches) return;
        return caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
      });
    }
  </script>
  <script>
    (function () {
      function paintOk(lat, lon) {
        var el = document.getElementById("locate-status");
        if (!el) return;
        el.textContent = "Got your location. " + lat + ", " + lon;
        el.className = "ok";
      }

      function paintErr(error) {
        var el = document.getElementById("locate-status");
        if (!el) return;
        var code = error && error.code != null ? error.code : "?";
        var message = error && error.message ? error.message : "";
        el.textContent = "Safari error " + code + ": " + message;
        el.className = "error";
      }

      function onOk(pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        paintOk(lat, lon);
        try {
          if (typeof window.planigatorLocateSuccess === "function") {
            window.planigatorLocateSuccess(pos);
          }
        } catch (e) {}
      }

      function fail(error) {
        paintErr(error);
        try {
          if (typeof window.planigatorLocateError === "function") {
            window.planigatorLocateError(error || { code: "?" });
          }
        } catch (e) {}
      }

      function onErr(error) {
        var code = error && error.code;
        if (code === 2 || code === 3) {
          navigator.geolocation.getCurrentPosition(onOk, fail, {
            enableHighAccuracy: false,
            timeout: 8000,
            maximumAge: 120000
          });
          return;
        }
        fail(error);
      }

      window.planigatorLocate = function () {
        navigator.geolocation.getCurrentPosition(onOk, onErr, {
          enableHighAccuracy: true,
          timeout: 12000
        });
      };
    })();
  </script>
  <script type="module" src="./js/app.js?v=44"></script>
</body>
</html>
