<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Accounts — Planigator</title>
  <link rel="icon" href="./favicon.png?v=77" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="./styles.css?v=90">
</head>
<body>
  <header>
    <a href="./">Planigator</a>
    <nav>
      <a href="./">Plan</a>
    </nav>
  </header>
  <main>
    <h1>Accounts</h1>
    <p id="status" class="muted">Loading…</p>
    <section id="visits" class="card" hidden>
      <h2>On the page</h2>
      <p id="here" class="muted">Loading visits…</p>
      <div id="ranges" class="visit-ranges"></div>
      <div id="chart" class="visit-chart"></div>
    </section>
    <section id="gifts" class="card" hidden>
      <h2>Credit codes</h2>
      <p class="muted">A person signs in with Google, then types the code on the plan page. Each code works once.</p>
      <form id="giftForm" class="gift-form">
        <label class="flag-box">Credits
          <input id="giftCredits" type="number" min="1" max="500" value="10" inputmode="numeric">
        </label>
        <button type="submit" class="flag-box">Make a code</button>
      </form>
      <p id="giftNote" class="muted"></p>
      <ul id="giftList"></ul>
    </section>
    <div id="list" class="card account-scroll" hidden>
      <table class="account-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Used</th>
            <th>Left</th>
            <th>Card</th>
            <th>Logged in</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="./js/accounts.js?v=6"></script>
</body>
</html>
