<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Follow — Planigator</title>
  <meta name="theme-color" content="#1f8a62">
  <link rel="icon" href="./favicon.png?v=77" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css?v=95">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body.app { background: #071525; }
    .follow-map { position: fixed; inset: 0; }
    .follow-banner, .follow-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      z-index: 2;
      max-width: 520px;
      margin: 0 auto;
    }
    .follow-banner {
      top: calc(10px + env(safe-area-inset-top));
      padding: 10px 12px;
      border-radius: 14px;
      background: rgb(7 21 37 / 0.92);
      color: #fffdf8;
    }
    .follow-banner h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .follow-banner p { margin: 4px 0 0; font-size: 14px; font-weight: 700; }
    .follow-note { margin: 2px 0 0; font-size: 12px; font-weight: 600; opacity: 0.8; }
    .follow-bar {
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .follow-bar button {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: #fffdf8;
      color: #14201c;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }
    .follow-you {
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #2f6fed;
      box-shadow: 0 0 0 6px rgb(47 111 237 / 0.28);
    }
    .follow-map .maplibregl-ctrl-attrib { font-size: 10px; background: rgb(0 0 0 / 0.55); }
    .follow-map .maplibregl-ctrl-attrib, .follow-map .maplibregl-ctrl-attrib a { color: #fff; }
  </style>
</head>
<body class="app">
  <div id="followMap" class="follow-map"></div>
  <section class="follow-banner">
    <p class="follow-note">Follow test. Not on the plan page.</p>
    <h1 id="followBanner">Opening the trip…</h1>
    <p id="followDetail"></p>
    <p class="follow-note" id="followStatus"></p>
  </section>
  <div class="follow-bar">
    <button type="button" id="followLock">Follow me</button>
    <button type="button" id="followOverview">Whole route</button>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./js/follow.js?v=2"></script>
</body>
</html>
