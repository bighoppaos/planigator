<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Planigator</title>
  <meta name="theme-color" content="#1f8a62">
  <link rel="icon" href="./favicon.png?v=77" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css?v=92">
</head>
<body class="app planner-only box-hover">
  <p class="build-line">Build#225 9.24.26. Box hover preview 2. <button type="button" class="text-button page-refresh" id="refreshPage">Refresh</button></p>
  <main id="app"></main>
  <footer>
    <nav>
      <a href="./">Plan</a>
      <a href="./support.html">Support</a>
      <a href="./privacy.html">Privacy</a>
      <a href="./terms.html">Terms</a>
    </nav>
    <p>Planning aid only. Not legal advice. Not a substitute for your ELD.</p>
  </footer>
  <style>
    .page-refresh { display: none; }
    html.from-home .page-refresh { display: inline; }
    .box-hover .hos,
    .box-hover .stops {
      margin-left: 0;
      margin-right: 0;
    }
    .box-hover .settings-grid,
    .box-hover .settings-pairs,
    .box-hover .set-pair,
    .box-hover .action-grid,
    .box-hover .stack {
      gap: 22px;
    }
    .box-hover .set-box,
    .box-hover .flag-box,
    .box-hover .stop-card,
    .box-hover .build-line,
    .box-hover .call-log-box,
    .box-hover .secondary,
    .box-hover button.example-load {
      filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.55));
    }
    .box-hover .stop-card {
      overflow: visible;
      margin-bottom: 28px;
    }
  </style>
  <script>
    (function () {
      var fromHome = window.navigator.standalone === true;
      try {
        if (window.matchMedia("(display-mode: standalone)").matches) fromHome = true;
        if (window.matchMedia("(display-mode: fullscreen)").matches) fromHome = true;
      } catch (e) {}
      if (fromHome) document.documentElement.classList.add("from-home");
      var url = new URL(location.href);
      if (url.searchParams.has("refresh")) {
        url.searchParams.delete("refresh");
        history.replaceState(null, "", url.pathname + url.search + url.hash);
      }
      var button = document.getElementById("refreshPage");
      if (!button) return;
      button.addEventListener("click", function () {
        var next = new URL(location.href);
        next.searchParams.set("refresh", String(Date.now()));
        location.replace(next.href);
      });
    })();
  </script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./js/app.js?v=219"></script>
</body>
</html>
